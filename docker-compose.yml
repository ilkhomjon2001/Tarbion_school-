# Faqat PostgreSQL. Backend va frontend lokalda to'g'ridan-to'g'ri
# ishga tushiriladi — qayta yuklash (hot reload) shunda tezroq.
#
#   docker compose up -d
#   docker compose logs -f db
#   docker compose down          # ma'lumot qoladi
#   docker compose down -v       # ma'lumot ham o'chadi

services:
  db:
    image: postgres:16-alpine
    container_name: tarbion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tarbion
      POSTGRES_PASSWORD: tarbion
      POSTGRES_DB: tarbion
      # Solishtirish va tartiblash o'zbekcha matn uchun to'g'ri ishlashi kerak.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # X-11: faqat lokal interfeysga bog'lanadi, tarmoqqa ochilmaydi.
      - "127.0.0.1:5432:5432"
    volumes:
      - tarbion-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarbion -d tarbion"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tarbion-pgdata:
