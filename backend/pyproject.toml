[project]
name = "tarbion-backend"
version = "0.1.0"
description = "Tarbion maktab boshqaruv platformasi — backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
    # Windows va slim Docker obrazlarida tizim tz bazasi yoʻq —
    # zoneinfo Asia/Tashkent ni topolmaydi va ilova ishga tushmaydi.
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `app` paketi backend/ ildizidan import qilinadi
pythonpath = ["."]
# Sessiya ko'lamidagi async fixture'lar (engine) uchun kerak — aks holda
# har test yangi hodisa siklida ishlaydi va ulanish qayta ishlatilmaydi.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
# Migratsiya fayllari Alembic tomonidan yasaladi — ularni qo'lda formatlash
# keyingi autogenerate'da baribir yo'qoladi. `env.py` tekshiriladi.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"seed.py" = ["S105", "S106"]
