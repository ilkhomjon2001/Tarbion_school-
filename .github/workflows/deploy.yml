name: Sinov · testlar va deploy

# `main` ga har push'da: avval testlar, oʻtgach serverga.
#
# Nega ikki bosqich: build va deploy tor IOPS li VPS da ishlaydi.
# Yiqiladigan koddan buni talab qilish keraksiz yuk — testlar avval
# GitHub yuguruvchisida oʻtadi.
#
# EHTIYOT YOʻL: commit SARLAVHASIDA (birinchi qatorida) `[tez]` boʻlsa
# testlar oʻtkazib yuboriladi. Shoshilinch tuzatish uchun — deploy
# ~3 daqiqada tugaydi. Ataylab qoʻlda yoziladigan belgi: tasodifan
# tushib qolmaydi va kim, qachon xavf olganini commit tarixida koʻrinadi.
#
# FAQAT SARLAVHA tekshiriladi, butun xabar emas — 2026-09-03 da bir
# marta tushilgan: commit IZOHIDA `[tez]` belgisi haqida yozilgan edi va
# `contains(head_commit.message, ...)` uni buyruq deb qabul qilib
# BARCHA testlarni oʻtkazib yubordi. Sarlavhani `if:` ifodasi ichida
# ajratib boʻlmaydi, shuning uchun u alohida ishda hisoblanadi.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Ketma-ket push'lar bir-birining ustiga chiqmasin: bir vaqtda ikkita
# deploy `git reset --hard` va `pnpm build` ni aralashtirib yuborardi.
concurrency:
  group: tarbion-deploy
  cancel-in-progress: false

jobs:
  # ─────────────────── Commit belgilari ───────────────────

  belgilar:
    name: Commit belgilari
    runs-on: ubuntu-latest
    outputs:
      tez: ${{ steps.aniqla.outputs.tez }}
    steps:
      - uses: actions/checkout@v4

      - id: aniqla
        run: |
          SARLAVHA="$(git log -1 --pretty=%s)"
          echo "Sarlavha: $SARLAVHA"
          if printf '%s' "$SARLAVHA" | grep -qF '[tez]'; then
            echo "tez=true" >> "$GITHUB_OUTPUT"
            echo "::warning::[tez] — testlar oʻtkazib yuborildi."
          else
            echo "tez=false" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────── Testlar ───────────────────────────

  backend:
    name: Backend · testlar
    runs-on: ubuntu-latest
    needs: belgilar
    if: needs.belgilar.outputs.tez != 'true'

    services:
      postgres:
        # Serverda 16 ishlaydi — CI ham oʻshanda sinasin, aks holda
        # faqat ishlab chiqarishda chiqadigan farq topilmay qolardi.
        image: postgres:16
        env:
          POSTGRES_USER: tarbion
          POSTGRES_PASSWORD: tarbion
          POSTGRES_DB: tarbion
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sinov bazasi
        run: |
          PGPASSWORD=tarbion createdb -h localhost -U tarbion tarbion_test

      - name: Bogʻliqliklar
        run: uv sync --frozen

      - name: Linter
        run: uv run ruff check .

      - name: Testlar
        env:
          # Ikkalasi ATAYLAB boshqa baza: `conftest.py` ular bir xil
          # boʻlsa ishlashdan bosh tortadi. Sabab — testlar sxemani
          # `DROP SCHEMA ... CASCADE` bilan qayta quradi va bir xil
          # boʻlsa ishchi bazani oʻchirib yuborardi.
          DATABASE_URL: postgresql+asyncpg://tarbion:tarbion@localhost:5432/tarbion
          TEST_DATABASE_URL: postgresql+asyncpg://tarbion:tarbion@localhost:5432/tarbion_test
          # 32 belgidan uzun boʻlishi shart (config validatori).
          JWT_SECRET: ci-uchun-vaqtinchalik-kalit-32-belgidan-uzun-2026
          APP_ENV: development
        # DIQQAT: bu yerda `.env` YOʻQ (u gitignore'da), yaʼni qolgan
        # hamma sozlama `config.py` STANDARTIDAN olinadi. Lokal `.env`
        # esa ularning bir qismini boshqacha qiladi — masalan
        # `COOKIE_SECURE=false` va `REQUIRE_TWO_FACTOR=false`.
        #
        # Shu sababli test lokal `.env` qiymatiga tayanmasligi kerak.
        # Bir marta tushilgan (2026-09-03): sessiya testlari httpx
        # cookie idishiga tayangan, `Secure` cookie esa `http://`
        # transportda saqlanmaydi — lokalda oʻtdi, CI da yiqildi.
        # Tekshirish: `COOKIE_SECURE=true REQUIRE_TWO_FACTOR=true pytest -q`
        run: uv run pytest -q

  frontend:
    name: Frontend · tip va build
    runs-on: ubuntu-latest
    needs: belgilar
    if: needs.belgilar.outputs.tez != 'true'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - name: Bogʻliqliklar
        run: corepack pnpm install --frozen-lockfile

      - name: Tiplar
        run: corepack pnpm exec tsc --noEmit

      - name: Kontrakt (backend enum'lari bilan moslik)
        run: corepack pnpm check:contracts

      - name: Build
        run: corepack pnpm build


  e2e:
    name: Kritik oqim · Playwright
    runs-on: ubuntu-latest
    needs: belgilar
    if: needs.belgilar.outputs.tez != 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tarbion
          POSTGRES_PASSWORD: tarbion
          POSTGRES_DB: tarbion
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Brauzer `127.0.0.1` da, shu sababli HTTPS yoʻq: `COOKIE_SECURE`
      # oʻchiriladi, aks holda refresh cookie umuman saqlanmaydi va
      # oqim login'dan oʻtmaydi.
      #
      # 2FA ham oʻchiriladi: u alohida `pytest` testlari bilan
      # qoplangan, bu yerda esa faqat davomat zanjiri tekshiriladi.
      DATABASE_URL: postgresql+asyncpg://tarbion:tarbion@localhost:5432/tarbion
      JWT_SECRET: ci-uchun-vaqtinchalik-kalit-32-belgidan-uzun-2026
      APP_ENV: development
      COOKIE_SECURE: "false"
      REQUIRE_TWO_FACTOR: "false"
      CORS_ORIGINS: http://127.0.0.1:3100
      # Bir martalik baza, bir martalik parol — sekret emas.
      E2E_PASSWORD: E2eCiSinov2026!
      E2E_PORT: "3100"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - name: Backend bogʻliqliklari
        working-directory: backend
        run: uv sync --frozen

      - name: Migratsiya va E2E maʼlumoti
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run python -m app.e2e_seed

      # `nohup` va `setsid` ataylab: qadam tugagach uning qobigʻi
      # yopiladi va oddiy `&` bilan qoʻyilgan jarayon SIGHUP olib
      # oʻlishi mumkin. Jurnal faylga yoziladi — yiqilganda sabab
      # artefaktda koʻrinsin.
      - name: Backend'ni koʻtarish
        working-directory: backend
        run: |
          setsid nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000             > uvicorn.log 2>&1 < /dev/null &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8000/health; then
            echo "--- uvicorn.log ---"
            cat uvicorn.log
            exit 1
          fi

      - name: Frontend bogʻliqliklari
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile

      - name: Brauzer
        working-directory: frontend
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Build
        working-directory: frontend
        run: corepack pnpm build

      # Testdan OLDIN backend hamon tirikligi tekshiriladi: u qadamlar
      # orasida oʻlgan boʻlsa, Playwright «Failed to fetch» deb
      # yiqilardi va sabab login sahifasida qolib ketardi.
      - name: Backend tirikmi
        working-directory: backend
        run: |
          if ! curl -sf http://127.0.0.1:8000/health; then
            echo "::error::Backend oʻlgan — quyida uvicorn jurnali."
            cat uvicorn.log
            exit 1
          fi

      - name: Oqim testi
        working-directory: frontend
        run: corepack pnpm e2e

      # Yiqilganda sabab kerak: iz (trace) va ekran surati.
      - name: Yiqilgan test izlari
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-izlari
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/uvicorn.log
          retention-days: 7

  # ─────────────────────────── Deploy ───────────────────────────

  deploy:
    name: Serverga
    needs: [belgilar, backend, frontend, e2e]
    runs-on: ubuntu-latest
    # `always()` kerak: `[tez]` bilan testlar SKIPPED boʻladi va
    # sukut boʻyicha bogʻliq ish ham oʻtkazib yuborilardi.
    #
    # Lekin `always()` yolgʻiz xavfli — u yiqilgan testda ham
    # ishlatardi. Shuning uchun natija ANIQ tekshiriladi: faqat
    # `success` yoki `skipped` oʻtadi, `failure` toʻsiladi.
    # `belgilar` MUVAFFAQIYATLI boʻlishi shart: u yiqilsa testlar
    # oʻtkazib yuborilishi kerakmi-yoʻqmi noaniq qoladi va `skipped`
    # ni «hammasi joyida» deb oʻqib boʻlmaydi.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.belgilar.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')

    steps:
      - name: SSH kaliti
        env:
          KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o ConnectTimeout=30 "$USER@$HOST" 'bash -s' <<'UZOQ'
          set -Eeuo pipefail
          export PATH="/root/.local/bin:/usr/local/bin:/usr/bin:/bin"
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          cd /opt/tarbion

          ESKI=$(git rev-parse HEAD)
          # GitHub'dan tortish vaqti-vaqti bilan uziladi (datacenter IP
          # cheklovi) — 3 urinish, oraliqda kutish bilan.
          for urinish in 1 2 3; do
            if git fetch -q origin main; then break; fi
            if [ "$urinish" = 3 ]; then echo "git fetch 3 urinishda ham boʻlmadi"; exit 1; fi
            echo "git fetch uzildi, $((urinish*10))s dan keyin qayta..."
            sleep $((urinish*10))
          done
          YANGI=$(git rev-parse origin/main)
          echo "commit: $ESKI → $YANGI"

          # ── Zaxira MIGRATSIYADAN OLDIN ──
          # Migratsiya maʼlumotni oʻzgartiradi va uni qaytarib boʻlmaydi.
          #
          # Bu KUNDALIK zaxira EMAS (u — `tarbion-backup.timer`, shifrlangan).
          # Buning yagona vazifasi — deploy notoʻgʻri ketsa DARHOL orqaga
          # qaytish. Aynan shu sababli u shifrlanmaydi: maxfiy kalit
          # ataylab serverdan tashqarida turadi (X-12), shifrlangan nusxa
          # esa tez qaytishga yaramaydi.
          #
          # Buning evazi — diskda ochiq PII yotadi. Shuning uchun:
          # `umask 077` (faqat root oʻqiydi) va atigi 5 tasi saqlanadi.
          mkdir -p /root/backups
          chmod 700 /root/backups
          umask 077
          BK=/root/backups/tarbion_$(date +%Y%m%d_%H%M%S).sql
          if sudo -u postgres pg_dump tarbion > "$BK" 2>/dev/null; then
            echo "zaxira: $BK ($(wc -c < "$BK") bayt)"
          else
            echo "OGOHLANTIRISH: zaxira olinmadi"
          fi
          ls -1t /root/backups/tarbion_*.sql 2>/dev/null | tail -n +6 | xargs -r rm -f

          git merge --ff-only origin/main

          qaytar() {
            echo "XATO — $ESKI ga qaytarilmoqda"
            cd /opt/tarbion && git reset --hard "$ESKI"
            systemctl restart tarbion-api tarbion-web tarbion-bot tarbion-outbox || true
            exit 1
          }
          trap qaytar ERR

          cd backend
          uv sync -q
          uv run python -c 'import app.main'
          uv run alembic upgrade head

          cd ../frontend
          corepack pnpm install --frozen-lockfile --prefer-offline
          corepack pnpm build

          trap - ERR
          # Bot va outbox worker ham qayta yoqiladi: ular ham shu
          # kodni ishlatadi va eski jarayon eski modellar bilan
          # qolib ketsa, migratsiyadan keyin yiqilardi.
          systemctl restart tarbion-api tarbion-web tarbion-bot tarbion-outbox
          UZOQ

      - name: Salomatlik tekshiruvi
        run: |
          # Xizmat koʻtarilishiga vaqt beramiz. Tekshiruv TASHQARIDAN,
          # Caddy orqali — serverdan qilinsa TLS va proksi zanjiri
          # sinovdan oʻtmay qolardi.
          for i in $(seq 1 12); do
            sleep 5
            KOD=$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://tarbion.uz/health/ready || echo 000)
            VEB=$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://tarbion.uz/login || echo 000)
            echo "urinish $i · api=$KOD veb=$VEB"
            if [ "$KOD" = "200" ] && [ "$VEB" = "200" ]; then
              echo "deploy tayyor"
              exit 0
            fi
          done
          echo "sayt koʻtarilmadi"
          exit 1
